[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-downloader-core"
version = "0.1.0"
description = "Cross-platform download engine for Smart Downloader (yt-dlp wrapper)"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
smart-downloader-engine = "core.engine:main"

[tool.setuptools]
packages = ["core"]
