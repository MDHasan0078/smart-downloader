name: Build macOS engine

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core-go/go.mod

      - name: Build engine binary
        run: |
          mkdir -p core/build/dist/engine
          cd core-go && go build -o ../core/build/dist/engine/engine .

      - name: Build minimal ffmpeg + bundle yt-dlp next to engine
        run: |
          curl -L -o core/build/dist/engine/yt-dlp "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos"
          brew install pkg-config
          bash core/build/ffmpeg/build_ffmpeg.sh /tmp/ffmpeg-src /tmp/ffmpeg-min
          cp /tmp/ffmpeg-min/bin/ffmpeg /tmp/ffmpeg-min/bin/ffprobe core/build/dist/engine/
          chmod +x core/build/dist/engine/yt-dlp core/build/dist/engine/ffmpeg core/build/dist/engine/ffprobe

      - name: Smoke test (ping + deps + metadata)
        run: |
          cd core/build/dist/engine
          ./ffmpeg -version 2>/dev/null | head -1 || exit 1
          ./ffprobe -version 2>/dev/null | head -1 || exit 1
          printf '{"id":1,"cmd":"ping"}\n' | ./engine
          printf '{"id":2,"cmd":"check_deps"}\n' | ./engine
          printf '{"id":3,"cmd":"get_info","url":"https://www.youtube.com/watch?v=jNQXAC9IVRw"}\n' \
            | ./engine

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-macos
          path: core/build/dist/engine
