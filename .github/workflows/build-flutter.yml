name: Build Flutter app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-flutter-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core-go/go.mod

      - name: Build engine binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/core/build/dist/engine" | Out-Null
          Push-Location "$env:GITHUB_WORKSPACE/core-go"
          go build -o "$env:GITHUB_WORKSPACE/core/build/dist/engine/engine.exe" .
          Pop-Location

      - name: Build minimal ffmpeg (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-lame
            mingw-w64-x86_64-opus

      - name: Bundle yt-dlp + ffmpeg next to engine
        shell: msys2 {0}
        run: |
          bundle="core/build/dist/engine"
          curl -L -o "$bundle/yt-dlp.exe" "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
          ./core/build/ffmpeg/build_ffmpeg.sh /tmp/ffmpeg-src /tmp/ffmpeg-min
          cp /tmp/ffmpeg-min/bin/* "$bundle/"
          ls -lh "$bundle"

      - name: Flutter pub get
        run: flutter pub get
        working-directory: app

      - name: Build Flutter app (Windows)
        run: flutter build windows --release
        working-directory: app

      - name: Bundle engine into app
        run: |
          $releaseDir = "app/build/windows/x64/runner/Release"
          Copy-Item -Recurse -Force "core/build/dist/engine" "$releaseDir/engine"
          Get-ChildItem $releaseDir

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          $version = if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') { $matches[1] } else { "0.0.0" }
          $bundle = "$env:GITHUB_WORKSPACE\app\build\windows\x64\runner\Release"
          $output = "$env:GITHUB_WORKSPACE\app\build"
          $icon = "$env:GITHUB_WORKSPACE\app\windows\runner\resources\app_icon.ico"
          & $iscc "$env:GITHUB_WORKSPACE/app/windows/installer.iss" `
            /DVERSION=$version "/DBUNDLE=$bundle" "/DOUTPUT=$output" "/DICON=$icon"
          Get-ChildItem "$output/*Setup.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-downloader-windows
          path: app/build/*Setup.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "app/build/*Setup.exe"

  build-flutter-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core-go/go.mod

      - name: Build engine binary
        run: |
          mkdir -p core/build/dist/engine
          cd core-go && go build -o ../core/build/dist/engine/engine .

      - name: Build minimal ffmpeg + bundle yt-dlp next to engine
        run: |
          curl -L -o core/build/dist/engine/yt-dlp "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos"
          brew install pkg-config
          bash core/build/ffmpeg/build_ffmpeg.sh "$RUNNER_TEMP/ffmpeg-src" "$RUNNER_TEMP/ffmpeg-min"
          cp "$RUNNER_TEMP/ffmpeg-min/bin/ffmpeg" "$RUNNER_TEMP/ffmpeg-min/bin/ffprobe" core/build/dist/engine/
          chmod +x core/build/dist/engine/yt-dlp core/build/dist/engine/ffmpeg core/build/dist/engine/ffprobe

      - name: Flutter pub get
        run: flutter pub get
        working-directory: app

      - name: Build Flutter app (macOS)
        run: flutter build macos --release
        working-directory: app

      - name: Bundle engine into .app
        run: |
          APP="app/build/macos/Build/Products/Release/smart_downloader.app"
          mkdir -p "$APP/Contents/Resources/engine"
          cp -R core/build/dist/engine/* "$APP/Contents/Resources/engine/"
          chmod +x "$APP/Contents/Resources/engine/engine"
          plutil -replace CFBundleName -string "Smart Downloader" "$APP/Contents/Info.plist"
          plutil -replace CFBundleDisplayName -string "Smart Downloader" "$APP/Contents/Info.plist"

      - name: Create .dmg
        run: |
          cd app/build/macos/Build/Products
          mkdir -p dmg-root
          cp -R "Release/smart_downloader.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Smart Downloader" -srcfolder dmg-root \
            -ov -format UDZO "SmartDownloader.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-downloader-macos
          path: app/build/macos/Build/Products/SmartDownloader.dmg

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "app/build/macos/Build/Products/SmartDownloader.dmg"
