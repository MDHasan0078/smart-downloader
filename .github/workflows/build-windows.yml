name: Build Windows engine

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core-go/go.mod

      - name: Build engine binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/core/build/dist/engine" | Out-Null
          Push-Location "$env:GITHUB_WORKSPACE/core-go"
          go build -o "$env:GITHUB_WORKSPACE/core/build/dist/engine/engine.exe" .
          Pop-Location

      - name: Build minimal ffmpeg (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-lame
            mingw-w64-x86_64-opus

      - name: Bundle yt-dlp + ffmpeg next to engine
        shell: msys2 {0}
        run: |
          bundle="core/build/dist/engine"
          curl -L -o "$bundle/yt-dlp.exe" "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
          ./core/build/ffmpeg/build_ffmpeg.sh /tmp/ffmpeg-src /tmp/ffmpeg-min
          cp /tmp/ffmpeg-min/bin/ffmpeg.exe /tmp/ffmpeg-min/bin/ffprobe.exe "$bundle/"
          ls -lh "$bundle"

      - name: Smoke test (ping + deps + metadata)
        shell: bash
        run: |
          cd core/build/dist/engine
          ./ffmpeg.exe -version 2>/dev/null | head -1 || exit 1
          ./ffprobe.exe -version 2>/dev/null | head -1 || exit 1
          printf '{"id":1,"cmd":"ping"}\n' | ./engine.exe
          printf '{"id":2,"cmd":"check_deps"}\n' | ./engine.exe
          printf '{"id":3,"cmd":"get_info","url":"https://www.youtube.com/watch?v=jNQXAC9IVRw"}\n' \
            | ./engine.exe

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          $version = if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') { $matches[1] } else { "0.0.0" }
          $bundle = "$env:GITHUB_WORKSPACE\core\build\dist\engine"
          $output = "$env:GITHUB_WORKSPACE\core\build\dist"
          & $iscc "$env:GITHUB_WORKSPACE/core/build/windows/installer.iss" `
            /DVERSION=$version "/DBUNDLE=$bundle" "/DOUTPUT=$output"
          Get-ChildItem "$output/*Setup.exe"

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-windows
          path: core/build/dist/engine

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-yt-downloader-windows-setup
          path: core/build/dist/*Setup.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "core/build/dist/*Setup.exe"
