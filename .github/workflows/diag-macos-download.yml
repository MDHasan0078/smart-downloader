name: Diagnose macOS lame download 2

on:
  workflow_dispatch:

jobs:
  replicate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replicate exact build env (yt-dlp + brew) then run script with bash -x
        run: |
          echo "== arch/curl info =="
          arch
          lipo -archs /usr/bin/curl 2>&1
          echo "== env before =="
          env | sort | grep -iE "curl|proxy|runner_temp|home" 
          curl -L -o core/build/dist/engine/yt-dlp "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" 2>/dev/null
          ls -l core/build/dist/engine/yt-dlp
          brew install pkg-config 2>&1 | tail -3
          echo "== env after brew =="
          env | sort | grep -iE "curl|proxy|runner_temp|home"
          mkdir -p core/build/dist/engine
          set +e
          bash -x core/build/ffmpeg/build_ffmpeg.sh "$RUNNER_TEMP/ffmpeg-src" "$RUNNER_TEMP/ffmpeg-min" > "$RUNNER_TEMP/script.log" 2>&1
          rc=$?
          echo "script exit=$rc"
          tail -40 "$RUNNER_TEMP/script.log"
          echo "== forensics =="
          ls -la "$RUNNER_TEMP/" 2>&1 | head -20
          df -h "$RUNNER_TEMP"
          umask

      - name: Isolate curl flags (s / retry)
        run: |
          rm -f "$RUNNER_TEMP/x1.bin" "$RUNNER_TEMP/x2.bin" "$RUNNER_TEMP/x3.bin"
          echo "== plain -o =="
          curl -L -o "$RUNNER_TEMP/x1.bin" "https://archive.ubuntu.com/ubuntu/pool/main/l/lame/lame_3.100.orig.tar.gz" -w "rc0 code=%{http_code} size=%{size_download}\n"; echo "rc=$?"
          ls -l "$RUNNER_TEMP/x1.bin"
          echo "== -fsSL no retry =="
          curl -fsSL -o "$RUNNER_TEMP/x2.bin" "https://archive.ubuntu.com/ubuntu/pool/main/l/lame/lame_3.100.orig.tar.gz" -w "rc0 code=%{http_code} size=%{size_download}\n"; echo "rc=$?"
          ls -l "$RUNNER_TEMP/x2.bin"
          echo "== -fsSL --retry 3 --retry-delay 2 =="
          curl -fsSL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/x3.bin" "https://archive.ubuntu.com/ubuntu/pool/main/l/lame/lame_3.100.orig.tar.gz" -w "rc0 code=%{http_code} size=%{size_download}\n"; echo "rc=$?"
          ls -l "$RUNNER_TEMP/x3.bin"

      - name: Download to the exact script destination path
        run: |
          rm -f "$RUNNER_TEMP/lame-3.100.tar.gz"
          curl -fsSL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/lame-3.100.tar.gz" \
            "https://archive.ubuntu.com/ubuntu/pool/main/l/lame/lame_3.100.orig.tar.gz" \
            -w "code=%{http_code} size=%{size_download}\n"; echo "rc=$?"
          ls -l "$RUNNER_TEMP/lame-3.100.tar.gz" 2>&1

      - name: Download after brew only
        run: |
          brew install pkg-config 2>&1 | tail -1
          rm -f "$RUNNER_TEMP/y1.bin"
          curl -fsSL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/y1.bin" \
            "https://archive.ubuntu.com/ubuntu/pool/main/l/lame/lame_3.100.orig.tar.gz" \
            -w "code=%{http_code} size=%{size_download}\n"; echo "rc=$?"
          ls -l "$RUNNER_TEMP/y1.bin" 2>&1
